<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Background circle -->
  <rect width="48" height="48" rx="12" fill="#0a0a0a"/>
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)" opacity="0.4"/>
  
  <!-- Outer glow ring -->
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="url(#ringGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- "L" letter -->
  <path d="M14 10.5 L14 34 L34 34" stroke="url(#letterGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Speed lines (rate limiting visual) -->
  <line x1="22" y1="15" x2="36" y2="15" stroke="#00e599" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="22" y1="22" x2="32" y2="22" stroke="#00e599" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="22" y1="29" x2="28" y2="29" stroke="#00e599" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
  
  <!-- Dot accent -->
  <circle cx="37" cy="34" r="3" fill="#00e599" opacity="0.9"/>
  
  <!-- Subtle inner glow -->
  <circle cx="24" cy="24" r="18" fill="url(#innerGlow)" opacity="0.15"/>
  
  <defs>
    <linearGradient id="letterGrad" x1="14" y1="10" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ffaa"/>
      <stop offset="50%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#00cc88"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00e599" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#00e599" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00e599" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#00e599" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>